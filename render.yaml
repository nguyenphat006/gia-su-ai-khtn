# Render Blueprint — Gia sư AI KHTN Backend
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: giasu-ai-khtn-api
    runtime: node
    plan: free
    region: singapore  # Gần Việt Nam nhất

    # Build & Start
    rootDir: server
    buildCommand: npm install --include=dev && npm run build && npx prisma db push --accept-data-loss
    startCommand: npm run start

    # Biến môi trường
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false  # Bạn sẽ tự điền Connection String của Supabase trên Dashboard Render
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: 15
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN_DAYS
        value: 7
      - key: ALLOWED_ORIGINS
        value: "https://gia-su-ai-khtn.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false  # Cần tự điền API key

    # Auto deploy khi push lên branch main
    autoDeploy: true


